services:
  postgres:
    image: postgres:18
    container_name: oevelse01-postgres
    environment:
      POSTGRES_USER: studie
      POSTGRES_PASSWORD: studie
      POSTGRES_DB: studiebase
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql
    networks:
      - oevelse01-net
    command: 
      -c shared_buffers=16MB
      -c work_mem=64kB
      -c effective_cache_size=32MB
      -c maintenance_work_mem=16MB
      -c max_connections=100

volumes:
  pgdata:

networks:
  oevelse01-net:
    driver: bridge
