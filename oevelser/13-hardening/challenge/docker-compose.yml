# Del F: bevidst usikker konfiguration — find og ret 3 sikkerhedsproblemer
services:
  db:
    image: postgres:18
    container_name: oevelse13-challenge
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123   # PROBLEM 1: hardcoded password, og svagt
      POSTGRES_DB: appdb
    ports:
      - "0.0.0.0:5432:5432"          # PROBLEM 2: eksponeret på alle interfaces
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - chdata:/var/lib/postgresql
    command:
      - -c ssl=off                  # PROBLEM 3: ingen TLS
      - -c hba_file=/etc/postgresql/pg_hba.conf
      - -c log_connections=off
      - -c log_statement=none

volumes:
  chdata:
