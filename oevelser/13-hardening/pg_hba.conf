# pg_hba.conf til øvelse 13-labben
# VIGTIGT: første match vinder — rækkefølgen betyder alt!
#   TYPE    DATABASE  USER      ADDRESS          METHOD

# lokal socket inde i db-containeren (kun til admin ved fejlfinding)
local   all       admin                   trust
local   all       all                     peer

# Kun app-net (autoriseret applikationsservice) må forbinde — kun med TLS + SCRAM
hostssl all       app_user  172.28.0.0/24   scram-sha-256
hostssl all       admin     172.28.0.0/24   scram-sha-256

# Hostens docker-gateway (172.28.0.1) — så Del D kan testes fra hosten, stadig kun med TLS
hostssl all       admin     172.28.0.1/32   scram-sha-256
hostssl all       app_user  172.28.0.1/32   scram-sha-256

# Alt andet afvises — inkl. attack-net (172.29.0.0/24) og alle forbindelser uden TLS
host    all       all       0.0.0.0/0       reject
hostssl all       all       0.0.0.0/0       reject
