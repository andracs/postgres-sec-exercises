services:
  postgres:
    image: postgres:18
    container_name: oevelse12-postgres
    environment:
      POSTGRES_USER: studie
      POSTGRES_PASSWORD: studie
      POSTGRES_DB: studiebase
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql
      - ./archive:/var/lib/postgresql/archive
      - ./backup:/backup
    networks:
      - oevelse12-net
    command:
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - "archive_command=test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f"

volumes:
  pgdata:

networks:
  oevelse12-net:
    driver: bridge
