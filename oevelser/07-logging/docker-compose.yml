services:
  postgres:
    image: postgres:18
    container_name: oevelse07-postgres
    environment:
      POSTGRES_USER: studie
      POSTGRES_PASSWORD: studie
      POSTGRES_DB: studiebase
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql
    networks:
      - oevelse07-net
    command: 
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c effective_cache_size=512MB
      -c log_connections=on
      -c log_statement=none
      -c log_min_duration_statement=500

volumes:
  pgdata:

networks:
  oevelse07-net:
    driver: bridge
